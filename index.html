<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div class="project-tabs" id="project-tabs"></div>
        <div class="nav-actions">
            <button class="btn-main" onclick="openNewProjectModal()">➕ Novo</button>
            <button id="theme-toggle" class="btn-icon" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <header>
        <div class="header-top">
            <h1 id="project-title">Carregando...</h1>
            <div class="backup-actions">
                <button class="btn-sm" onclick="exportCSV()">📊 CSV</button>
                <button class="btn-sm" onclick="exportJSON()">💾 Backup</button>
                <label class="btn-sm">
                    📂 Importar
                    <input type="file" style="display:none" onchange="importJSON(event)" accept=".json">
                </label>
                <button class="btn-sm btn-danger" onclick="resetSystem()">🔄 Reset</button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-title">Progresso</span>
                <span id="metric-months" class="metric-value">0 / 0</span>
                <span id="metric-percent" class="metric-sub">0% concluído</span>
            </div>
            <div class="metric-card highlight-green">
                <span class="metric-title">Pago</span>
                <span id="metric-paid" class="metric-value">R$ 0,00</span>
                <span id="metric-total" class="metric-sub">de R$ 0,00</span>
            </div>
            <div class="metric-card highlight-orange">
                <span class="metric-title">Restante</span>
                <span id="metric-remaining" class="metric-value">R$ 0,00</span>
                <span class="metric-sub">a repassar</span>
            </div>
        </div>

        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="filters-container">
            <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">Todos</button>
            <button class="filter-btn" id="filter-pending" onclick="setFilter('pending')">Pendentes</button>
            <button class="filter-btn" id="filter-paid" onclick="setFilter('paid')">Pagos</button>
        </div>
    </header>

    <div id="items-container" class="items-wrapper"></div>
</div>

<div id="modal-new-project" class="modal-overlay">
    <div class="modal-box">
        <h2>Criar Novo Controle</h2>
        <div class="input-group">
            <label>Nome do Projeto</label>
            <input type="text" id="new-proj-name" placeholder="Ex: Aluguel, Carro...">
        </div>
        <div class="input-group">
            <label>Valor da Parcela (R$)</label>
            <input type="number" id="new-proj-value" placeholder="2000" step="0.01">
        </div>
        <div class="input-group">
            <label>Quantidade de Parcelas</label>
            <input type="number" id="new-proj-months" placeholder="24">
        </div>
        <div class="input-group">
            <label>Data da 1ª Parcela</label>
            <input type="date" id="new-proj-date">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
            <button class="btn-save" onclick="createNewProject()">Salvar</button>
        </div>
    </div>
</div>

<div id="modal-note" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="note-modal-title">Anotação</h3>
            <button class="btn-close" onclick="closeModals()">✖</button>
        </div>
        <textarea id="note-text-input" class="modal-textarea" rows="4" placeholder="Escreva detalhes sobre o pagamento..."></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
            <button class="btn-save" onclick="saveNote()">Salvar Nota</button>
        </div>
    </div>
</div>

<div id="modal-viewer" class="modal-overlay">
    <div class="modal-box modal-large">
        <div class="modal-header">
            <h3>Comprovante Anexado</h3>
            <button class="btn-close" onclick="closeModals()">✖</button>
        </div>
        <div id="viewer-content" class="viewer-content"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
